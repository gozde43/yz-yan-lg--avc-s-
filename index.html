<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hata Avcısı - Matematik Problemleri</title>
    <!-- CSS Dosyası -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Hata Avcısı</h1>
            <p>Yapay zekanın çözümünü incele, hatalı adımı seç ve düzeltme işlemini yaz!</p>
        </header>

        <main>
            <div id="soru-alani">
                <p id="durum">Soru Yükleniyor...</p>
            </div>

            <section class="cozum-bolumu">
                <h3>🔍 Yapay Zekanın Çözüm Adımları:</h3>
                <div id="adimlar-listesi"></div>
            </section>

            <section class="etkilesim-bolumu">
                <h3>Hata Tespiti ve Düzeltme</h3>
                <p>1. Hangi adımda hata yapıldı?</p>
                <div id="adim-secim-alani"></div>

                <p>2. Doğru İşlemi ve Sonucu Yaz:</p>
                <input type="text" id="dogru-islem-input" placeholder="Örn: 1053 / 9">
                <input type="text" id="dogru-sonuc-input" placeholder="Örn: 117">
                
                <button id="gonder-btn" onclick="dogrulaVeGonder()">Doğrula ve Gönder</button>
                <button id="sonraki-btn" onclick="sonrakiSoruyaGec()" style="display:none;">Sonraki Soruya Geç →</button>
            </section>
        </main>
    </div>

    <!-- JavaScript Dosyası -->
    <script src="/static/script.js"></script>
</body>
</html>
